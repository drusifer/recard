<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recard — a deck of cards for the same room</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <button id="rules-toggle" type="button" class="rules-toggle">Rules</button>
  <div id="rules-panel" class="overlay" hidden>
    <button id="rules-close" type="button" class="overlay-close">Close</button>
    <h2>How to play</h2>
    <div id="rules-content"></div>
  </div>

  <main id="screen-landing" class="screen">
    <h1>Recard</h1>
    <p>A shared deck of cards for people in the same room. No install, no accounts.</p>
    <div class="btn-row">
      <!-- Resume is first and always visible, disabled rather than hidden:
           a control that appears only sometimes can't be learned. -->
      <button id="resume-game" type="button" class="btn-primary" disabled>Resume Game</button>
      <button id="show-host" type="button" class="btn-primary">Host Game</button>
      <button id="show-join" type="button" class="btn-primary">Join Game</button>
    </div>
    <p id="resume-hint" class="deck-config"></p>
  </main>

  <main id="screen-host" class="screen" hidden>
    <h1>Host a table</h1>
    <div id="host-form" class="panel">
      <label>Your name <input id="host-name" type="text" maxlength="20" /></label>
      <label>Quick-start
        <select id="host-preset">
          <option value="">Custom (set up manually below)</option>
        </select>
      </label>
      <p id="host-preset-preview" class="deck-config" hidden></p>
      <!-- D47: DeckDefinition's first host-facing field. Jokers stays
           visible regardless of type - pinochle's own build() silently
           ignores it rather than this control needing to know which
           types care about jokers and which don't. -->
      <label>Deck type
        <select id="host-deck-type">
          <option value="standard">Standard (52 cards)</option>
          <option value="pinochle">Pinochle (48 cards)</option>
        </select>
      </label>
      <label>Decks <select id="host-num-decks"><option value="1">1</option><option value="2">2</option></select></label>
      <label>Jokers <select id="host-jokers"><option value="0">0</option><option value="2">2</option><option value="4">4</option></select></label>
      <!-- D46: GameConfig's first real field. Checked (allowed) by
           default, matching every prior sprint's behavior exactly - Add
           Zone was always available before this control existed. -->
      <label><input id="host-allow-player-zones" type="checkbox" checked /> Players can add zones</label>
      <!-- US-42: OPTIONAL. Empty means no auto-start, i.e. exactly the
           behaviour before this existed (Smith Gate 1 answer 3). It is a
           start TRIGGER, not a capacity limit - a 5th player may still
           join a table expecting 4; the game simply doesn't re-deal. -->
      <label>Start automatically at
        <input id="host-expected-players" type="number" min="2" max="8" placeholder="any" />
        players <small>(optional)</small>
      </label>
      <button id="create-table" type="button" class="btn-primary">Create Table</button>
      <p id="host-create-error" class="error-text" hidden></p>
    </div>
    <div id="host-share" class="panel panel-felt" hidden>
      <p>Share this code or link with the room:</p>
      <div id="share-code-container"></div>
      <p id="host-deck-config" class="deck-config"></p>
      <div id="host-deck-area" class="deck-area"></div>
      <ul id="host-roster" class="roster"></ul>
      <!-- D53: min 0, not 1 - Solitaire/Spit deal the whole deck into
           declared table zones instead of a hand, so 0 is a real value
           a preset can prefill here, not a typo to block. -->
      <label>Cards per player <input id="cards-per-player" type="number" min="0" max="20" value="7" /></label>
      <!-- Smith Gate 1 #3: say what the table is waiting for BEFORE it
           happens, or the screen changes under the host with no cause. -->
      <p id="autostart-status" class="deck-config" hidden></p>
      <!-- Manual start always stays: someone always drops out, and a host
           who wants to start 3-of-4 must be able to (Smith Gate 1 AC). -->
      <button id="deal-btn" type="button" class="btn-primary">Deal &amp; Start</button>
      <!-- US-45: a restored table waits for the players who were at it,
           and names them. "Start anyway" is present from the first second,
           not revealed after a timeout (Smith Gate 1 #4) - a wait with no
           visible exit is what makes people force-reload. -->
      <div id="restore-waiting" class="panel restore-waiting" hidden>
        <p class="waiting-summary"></p>
        <ul class="waiting-list"></ul>
        <button id="resume-anyway-btn" type="button">Start anyway, without them</button>
      </div>
    </div>
  </main>

  <main id="screen-join" class="screen" hidden>
    <h1>Join a table</h1>
    <div id="join-form" class="panel">
      <label>Your name <input id="join-name" type="text" maxlength="20" /></label>
      <label>Table code <input id="join-code" type="text" /></label>
      <button id="join-btn" type="button" class="btn-primary">Join</button>
      <p id="join-status" class="deck-config"></p>
    </div>
    <ul id="join-roster" class="roster"></ul>
  </main>

  <main id="screen-game" class="screen" hidden>
    <!-- The table code stays on screen for the whole game: someone
         arriving late, or rejoining, always needs it, and hunting for it
         used to mean leaving the table. -->
    <div class="game-code-bar">
      <span class="game-code-label">Table code</span>
      <code id="game-code"></code>
      <!-- Icon and accessible name are set by `wireCopyCode` so the game
           bar and the host share screen cannot drift apart. -->
      <button id="copy-code-btn" type="button" aria-label="Copy table code"></button>
    </div>
    <section class="panel panel-felt table-section">
      <h2 class="sr-only">Table</h2>
      <div id="table-surface" class="table-surface">
        <!-- UX follow-up (direct user request): "just have table-surface
             -> zone" - every pile/zone panel (shared, personal, AND the
             deck) is a direct child of this one container now, no
             `#table-center`/`#table-area`/`#seat-zones` split. Rebuilt
             wholesale every render by `ui.js`'s `renderZones`/`main.js`. -->
        <div id="zones"></div>
        <!-- US-41: a failed deal reports beside the deck, where the
             click that caused it happened. Outside `#zones` because that
             container is rebuilt wholesale every render. -->
        <p id="deck-error" class="error-text" hidden></p>
      </div>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
