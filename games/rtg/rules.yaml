# Recard the Gathering, written out in full (D151). Authored once, so a person
# can argue with it; every question that cites a rule names it as rules.<key>.

name: Recard the Gathering
note: The rules below are written out IN FULL on purpose (US-127/D151).
  Recard's own rules reference gives this game three sentences, which assume
  conventions they never state. Those conventions were researched and
  written down here, once, so that a person can argue with them and play
  never depends on what a model happens to remember.
rules:
  goal: Each player starts at 20 life. Reduce the opponent to 0.
  turn_sequence: "A turn goes: untap everything you control, draw one card,
    then a main phase, then combat, then the turn ends. You may cast spells
    and play a land during your main phase."
  land_drop: You may put at most one land onto the battlefield per turn, from
    your hand, and only during your own main phase.
  mana: Tap an untapped land you control to pay for a spell. A spell's cost
    must be paid in full before it is cast; a spell you cannot pay for
    cannot be cast.
  casting: A spell you cast goes on the shared Stack. The Stack resolves
    top-down once both players are done responding. A creature that resolves
    arrives on your battlefield.
  summoning_sickness: A creature cannot attack, and cannot be tapped for an
    effect, unless it has been on your battlefield since the beginning of
    your most recent turn. A creature that arrived this turn cannot attack
    this turn.
  attacking: Only untapped creatures without summoning sickness may attack.
    Attacking taps the creature. You choose which of your creatures attack;
    you attack the opponent, not their creatures.
  blocking: The defending player may block each attacking creature with one
    untapped creature they control. A tapped creature cannot block. A
    creature that arrived this turn may still block.
  damage: An attacking creature blocked by a creature deals its power to that
    blocker and takes the blocker's power in return; a creature that has
    taken damage equal to or greater than its toughness dies and goes to its
    owner's graveyard. An unblocked attacker deals its power to the
    defending player, who loses that much life.
  priority: "Either player may respond while something is on the Stack. Recard
    does not track priority: players say what they are doing, and the table
    settles it."
  seating: Turns pass clockwise. The player counter-clockwise from me is the
    one whose turn it currently is, if anyone's.
  no_mechanical_signal: Nothing about the board alone proves a turn has ended
    - a player may hold mana untapped for instants, and may choose not to
    attack at all. Work out what happened from the board as it stands now
    and what was said, in order.
  first_player: Before the first turn the table decides who goes first. Usually each
    player rolls a die in table talk (/roll d20) and the highest roll goes
    first, rolling again on a tie; the table may also simply agree. After
    that first turn, turns pass clockwise as rules.seating says.
