- id: rtg-w-009
  name: Sunspire Vindicator
  cost: '{3}{W}'
  type: Creature
  subtype: Human Knight
  rarity: uncommon
  power: 4
  toughness: 4
  text: 'Vigilance, lifelink'
  art: >-
    A towering knight in radiant filigreed plate standing before a white
    marble spire, greatsword point-down, light pooling at their feet,
    ivory and molten gold palette, high fantasy oil painting, symmetrical
  flavor: >-
    The spire does not defend the city. The spire reminds the city what it
    promised to defend.

- id: rtg-w-010
  name: Herald of the Unsetting Sun
  cost: '{4}{W}'
  type: Creature
  subtype: Angel
  rarity: rare
  power: 5
  toughness: 5
  text: 'Flying, vigilance'
  art: >-
    A vast winged herald hovering with six sunlit wings and a horn of white
    gold, clouds parted into a radiating corona behind, ivory amber and
    blinding highlight palette, high fantasy oil painting, awe scale
  flavor: >-
    The Legion swore its oath to a sun that sets. She is what they were
    actually promised.
