# Recard the Gathering — the ten guild (two-colour) decks (US-78).
#
# Every guild deck uses the same skeleton, so the ten differ by CONTENT
# rather than by construction — which is what makes them comparable at a
# table, and what makes the balance linter meaningful across all of them:
#
#   24 lands   8 basic A + 8 basic B + 4 dual + 4 Wellspring
#              -> 16 sources of each colour, clearing the 15-source
#              minimum with one to spare.
#
#              TWO dual cycles, not one, because a dual is not a basic
#              land and so is limited to 4 copies (real Magic rule, and
#              `make lint-decks` caught the first draft trying to run 8).
#              One cycle alone caps a 24-land deck at 14 sources — one
#              short — and the alternatives were pushing every guild deck
#              to 26 lands (turning them all into control decks, wrong
#              for the likes of the Emberoath) or lowering the source
#              minimum. Printing a second cycle is Magic's own answer.
#   24 gold    the guild's own 6 cards, 4 copies each
#   12 mono    3 cheap cards borrowed from the two parent colour pools
#   ---------
#   60 cards, midrange band (24-25 lands), curve 20 cheap / 4 expensive
#
# The three borrowed mono cards are always cmc<=2: the gold cards supply
# the guild's identity and its top end, and the borrowed cards supply the
# early plays that keep the curve left-skewed.

